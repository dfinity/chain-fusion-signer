# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.8.0/docs/schemas/icp-yaml-schema.json
canisters:
  - name: signer
    build:
      steps:
        - type: script
          commands:
            - scripts/build.signer.sh
            - cp out/signer.wasm.gz "$ICP_WASM_OUTPUT_PATH"
    # Must match `scripts/build.signer.args.sh` for every environment.  icp-cli reads args files
    # when it loads the project, so it cannot use the generated `out/signer.args.did`.
    init_args: |
      (variant { Init = record {
        ecdsa_key_name = "dfx_test_key";
        ic_root_key_der = null;
        cycles_ledger = opt principal "um5iw-rqaaa-aaaaq-qaaba-cai";
      }})
    # See `scripts/build.upgrade.args.sh`.
    upgrade_args: "(variant { Upgrade })"
  - name: cycles_depositor
    build:
      steps:
        - type: pre-built
          url: https://github.com/dfinity/cycles-ledger/releases/download/cycles-ledger-v1.0.1/depositor.wasm.gz
          sha256: 79d8000abb2413da7077e296bf8abc56bd425d89b9c6de90778312b193ccd025
    init_args: '(record { ledger_id = principal "um5iw-rqaaa-aaaaq-qaaba-cai" })'
  - name: example_backend
    build:
      steps:
        - type: script
          commands:
            - scripts/build.example_backend.sh
            - cp out/example_backend.wasm.gz "$ICP_WASM_OUTPUT_PATH"
  - name: example_frontend
    recipe:
      type: "@dfinity/asset-canister@v2.2.1"
      configuration:
        dir: src/example_frontend/dist
        build:
          - npm ci
          - npm run build --workspace example_frontend
networks:
  - name: local
    mode: managed
    ii: true
environments:
  - name: staging
    network: ic
    canisters: [signer]
    init_args:
      signer: |
        (variant { Init = record {
          ecdsa_key_name = "test_key_1";
          ic_root_key_der = null;
          cycles_ledger = opt principal "um5iw-rqaaa-aaaaq-qaaba-cai";
        }})
  - name: beta
    network: ic
    canisters: [signer]
    init_args:
      signer: |
        (variant { Init = record {
          ecdsa_key_name = "key_1";
          ic_root_key_der = null;
          cycles_ledger = opt principal "um5iw-rqaaa-aaaaq-qaaba-cai";
        }})
  # Production.  Upgrades go through NNS proposals (`scripts/propose`), not `icp deploy`.
  - name: ic
    network: ic
    canisters: [signer]
    init_args:
      signer: |
        (variant { Init = record {
          ecdsa_key_name = "key_1";
          ic_root_key_der = null;
          cycles_ledger = opt principal "um5iw-rqaaa-aaaaq-qaaba-cai";
        }})
