name: Deploy to Staging
on:
  # Auto-deploy a release: when the Release workflow has built the artifacts
  # for a v* tag, deploy exactly those artifacts to staging.
  workflow_run:
    workflows: ['Release']
    types: [completed]
  # Manual deployment of any ref, from a fresh reproducible build.
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash -euxlo pipefail {0}
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          persist-credentials: false
      - name: Get release artifacts
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-artifacts
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Build reproducibly
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/build
      - name: Check that the release uses icp-cli
        # A release triggers this workflow from the default branch, but the checkout is the
        # release tag.  Releases from before the icp-cli migration have no icp.yaml.
        run: |
          test -e icp.yaml || {
            echo "ERROR: This release predates the icp-cli migration."
            echo "       Deploy it with 'Run workflow' on this workflow, selecting the release tag."
            exit 1
          }
      - name: Install icp-cli
        run: scripts/setup icp-cli
      - name: Import deployment identity
        run: |
          key_pem=$(mktemp)
          printenv DEPLOY_KEY > "$key_pem"
          icp identity import deploy --from-pem "$key_pem" --storage plaintext
          rm "$key_pem"
          icp identity default deploy
          icp identity principal
        env:
          DEPLOY_KEY: ${{ secrets.DFX_DEPLOY_KEY_STAGING }}
      - name: Deploy signer to staging
        # The artifacts carry the init args for the ic environment (ecdsa_key_name = "key_1"),
        # which must never be applied to staging, so they are not used here.  Instead the
        # upgrade argument `(variant { Upgrade })` keeps the existing staging configuration;
        # see `scripts/build.upgrade.args.sh`.  `--yes` skips the Candid compatibility prompt.
        run: |
          icp canister install signer -e staging --mode upgrade --wasm out/signer.wasm.gz \
            --args '(variant { Upgrade })' --yes
      - name: Verify deployment
        run: |
          sha256sum out/signer.wasm.gz
          icp canister status signer -e staging
          icp canister metadata signer git:commit -e staging
          # Fail loudly rather than leave staging silently pointed at the production key.
          key="$(icp canister call signer config '()' --query -e staging | sed -n 's/.*ecdsa_key_name = "\([^"]*\)".*/\1/p')"
          [ "$key" = "test_key_1" ] || { echo "ERROR: staging ecdsa_key_name is '$key', expected test_key_1"; exit 1; }
